name: Signature Studio browser QA
on:
  push:
    branches:
      - feature/guided-signature-studio-2026-11
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tester
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run local site and browser tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/spss-http.log 2>&1 &
          sleep 2
          node tests/studio.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signature-studio-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
